name: Court availability alerts

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test Telegram connection or check favorite courts'
        type: choice
        options:
          - check
          - test
        default: check

permissions:
  contents: write

concurrency:
  group: court-availability-alerts
  cancel-in-progress: false

jobs:
  check-courts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify alert rules
        run: node --test tests/alerts.test.mjs
      - name: Check availability and send personal Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MODE: ${{ inputs.mode || 'check' }}
          TZ: Asia/Manila
        run: |
          if [ "$ALERT_MODE" = "test" ]; then
            node telegram-alerts.mjs --test
          else
            node telegram-alerts.mjs
          fi
      - name: Save alert history for duplicate prevention
        if: ${{ always() }}
        run: |
          if [ ! -f state/alerts.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/alerts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update court alert availability history"
          git pull --rebase
          git push
